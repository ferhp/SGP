{% extends "layout.html" %}
{% block titulo %}{{ 'Registrar costo' if es_nuevo else 'Editar costo' }}{% endblock %}
{% block contenido %}
<div class="encabezado-pagina">
  <h1>{{ 'Registrar costo' if es_nuevo else 'Editar costo' }}</h1>
</div>

<div class="tarjeta formulario">
  <form method="post">
    <div class="form-rejilla">
      <div class="campo campo-ancho">
        <label for="proyecto_id">Proyecto *</label>
        <select id="proyecto_id" name="proyecto_id" required>
          <option value="">Seleccione…</option>
          {% for p in proyectos %}
          <option value="{{ p.id }}"
            {% if p.id == costo.proyecto_id or (es_nuevo and p.id == preseleccion) %}selected{% endif %}>
            {{ p.clave }} — {{ p.nombre }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="campo">
        <label for="categoria">Categoría *</label>
        <select id="categoria" name="categoria" required>
          <option value="">Seleccione…</option>
          {% for c in categorias %}<option value="{{ c }}" {% if c == costo.categoria %}selected{% endif %}>{{ c }}</option>{% endfor %}
        </select>
      </div>
      <div class="campo">
        <label for="fecha">Fecha *</label>
        <input id="fecha" type="date" name="fecha" value="{{ costo.fecha or '' }}" required>
      </div>
      <div class="campo campo-ancho">
        <label for="concepto">Concepto *</label>
        <input id="concepto" name="concepto" value="{{ costo.concepto or '' }}" maxlength="200" required>
      </div>
      <div class="campo">
        <label for="proveedor_id">Proveedor</label>
        <select id="proveedor_id" name="proveedor_id">
          <option value="">Sin proveedor</option>
          {% for prov in proveedores %}
          <option value="{{ prov.id }}" {% if prov.id == costo.proveedor_id %}selected{% endif %}>{{ prov.nombre }}</option>
          {% endfor %}
        </select>
        <small>
          <a href="{{ url_for('costos.proveedor_nuevo') }}" style="color:var(--azul)">
            <span class="material-symbols-outlined" style="font-size:15px">add</span>
            Dar de alta proveedor
          </a>
        </small>
      </div>
      <div class="campo">
        <label for="monto">Monto (MXN) *</label>
        <input id="monto" type="number" step="0.01" min="0.01" name="monto" value="{{ costo.monto or '' }}" required>
      </div>
    </div>
    <div class="acciones-form">
      <button class="boton" type="submit"><span class="material-symbols-outlined">save</span> Guardar</button>
      <a class="boton boton-secundario" href="{{ url_for('costos.lista') }}">Cancelar</a>
    </div>
  </form>
</div>

{% if not es_nuevo %}
<form method="post" action="{{ url_for('costos.eliminar', id=costo.id) }}"
      onsubmit="return confirm('¿Eliminar este costo?');">
  <button class="boton boton-peligro" type="submit">
    <span class="material-symbols-outlined">delete</span> Eliminar costo
  </button>
</form>
{% endif %}
{% endblock %}
